<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://static.line-scdn.net 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'"><title>AI予約受付 | pepel moco</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:520px;margin:0 auto;padding:18px;background:#faf9f6;color:#292923}h1{font-size:22px}.banner{background:#fff0c2;padding:8px;border-radius:8px}.log{min-height:230px;max-height:55vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:12px;padding:12px}.msg{white-space:pre-wrap;margin:10px 0;padding:10px;border-radius:10px;background:#f1efe7}.user{margin-left:20%;background:#e8f4e9}.form{display:flex;gap:8px;margin:12px 0}.form input{flex:1;min-width:0;padding:12px}.form button{padding:10px}.links{display:flex;justify-content:space-between}.status{min-height:1.5em;color:#755}.disabled{opacity:.65}</style></head><body><header><h1>会話で予約 | pepel moco</h1><p class="banner">開発用・テスト中。予約先は開発環境です。通常予約もいつでも利用できます。</p></header><main><p id="status" class="status" aria-live="polite">LINE認証を確認しています…</p><div id="log" class="log" aria-live="polite"></div><form id="form" class="form"><input id="text" maxlength="200" autocomplete="off" placeholder="例：明日空いてる？" disabled><button id="send" disabled>送信</button></form><nav class="links"><a href="../">自分で選ぶ（通常予約）</a><a href="../policy/" target="_blank" rel="noopener noreferrer">キャンセルポリシー</a><button id="clear" type="button">会話をやめる</button></nav></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>const API="https://script.google.com/macros/s/AKfycbwdeG03XknIH_bakpU91_Yc0KjH-q12EE1sa0oOtPVlfgzRIGGweUr4j3iAUttXyzYYqw/exec",LIFF_ID="2010569259-TN2sWps6";const statusEl=document.getElementById('status'),log=document.getElementById('log'),input=document.getElementById('text'),send=document.getElementById('send');let token=null;
function bubble(text,who){const p=document.createElement('p');p.className='msg '+who;p.textContent=text;log.append(p);log.scrollTop=log.scrollHeight;}
function turnId(){const b=new Uint8Array(24);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');}
async function boot(){try{if(typeof liff==='undefined')throw Error('LIFF SDK unavailable');await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return;}token=liff.getIDToken();if(!token)throw Error('ID token unavailable');statusEl.textContent='LINEログイン済み。予約希望を送ると本人確認します。';input.disabled=false;send.disabled=false;bubble('ご希望の日付やメニューを送ってください。例：明日空いてる？　複雑な施術相談は店舗へお問い合わせください。','msg');}catch(_){statusEl.textContent='LINEログインを確認できません。通常予約をご利用ください。';document.querySelector('.form').classList.add('disabled');}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||!token)return;input.value='';input.disabled=true;send.disabled=true;bubble(text,'user');try{const r=await fetch(API,{method:'POST',body:JSON.stringify({sourceType:'AI_BOOKING',action:'turn',lineIdToken:token,text,turnId:turnId()}),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});const data=await r.json();for(const m of data.messages||[data.message||'通常予約をご利用ください。'])bubble(m,'msg');if(data.cancelToken&&data.reservationId){const p=document.createElement('p'),a=document.createElement('a');a.href='../cancel/#cancel='+encodeURIComponent(data.reservationId)+'&token='+encodeURIComponent(data.cancelToken);a.textContent='予約のキャンセル用リンクを保存';p.appendChild(a);log.appendChild(p);}if(data.fallback==='regular_booking')statusEl.textContent='通常予約へ切り替えられます。';}catch(_){bubble('応答を取得できませんでした。予約は未確定の可能性があります。二重送信せず、店舗へご確認ください。','msg');statusEl.textContent='通信を確認してください。'}finally{input.disabled=false;send.disabled=false;input.focus();}});
document.getElementById('clear').addEventListener('click',async()=>{document.getElementById('text').value='やめる';document.getElementById('form').requestSubmit();});boot();</script></body></html>
