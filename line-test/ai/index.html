<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://static.line-scdn.net 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com https://api.line.me https://liffsdk.line-scdn.net; base-uri 'none'; form-action 'none'; object-src 'none'"><title>AI予約受付 | pepel moco</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:520px;margin:0 auto;padding:18px;background:#faf9f6;color:#292923}h1{font-size:22px}.banner{background:#fff0c2;padding:8px;border-radius:8px}.log{min-height:230px;max-height:55vh;overflow:auto;background:white;border:1px solid #ddd;border-radius:12px;padding:12px}.msg{white-space:pre-wrap;margin:10px 0;padding:10px;border-radius:10px;background:#f1efe7}.user{margin-left:20%;background:#e8f4e9}.form{display:flex;gap:8px;margin:12px 0}.form input{flex:1;min-width:0;padding:12px}.form button{padding:10px}.links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.status{min-height:1.5em;color:#755}.disabled{opacity:.65}.choices{display:grid;gap:8px;margin:8px 0}.choices button,.actions button{min-height:44px;padding:10px;border:1px solid #58786b;border-radius:9px;background:#fff;color:#183d32;font:inherit;text-align:left}.card{background:#fff;border:1px solid #d8d5cc;border-radius:12px;padding:12px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button.primary{background:#234f43;color:#fff}.actions button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:14px;color:#554}</style></head><body><header><h1>会話で予約 | pepel moco</h1><p class="banner">開発用・テスト中。予約先は開発環境です。通常予約もいつでも利用できます。</p></header><main><p id="status" class="status" aria-live="polite">LINE認証を確認しています…</p><div id="log" class="log" aria-live="polite"></div><form id="form" class="form"><input id="text" maxlength="200" autocomplete="off" placeholder="例：明日空いてる？" disabled><button id="send" disabled>送信</button></form><nav class="links"><a href="../">自分で選ぶ（通常予約）</a><a href="../policy/" target="_blank" rel="noopener noreferrer">キャンセルポリシー</a><button id="clear" type="button">会話をやめる</button></nav></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>const API="https://script.google.com/macros/s/AKfycbwdeG03XknIH_bakpU91_Yc0KjH-q12EE1sa0oOtPVlfgzRIGGweUr4j3iAUttXyzYYqw/exec",LIFF_ID="2010569259-TN2sWps6";const statusEl=document.getElementById('status'),log=document.getElementById('log'),input=document.getElementById('text'),send=document.getElementById('send');let token=null,locked=false,authBlocked=false,lastText='';
function bubble(text,who){const p=document.createElement('p');p.className='msg '+who;p.textContent=text;log.append(p);log.scrollTop=log.scrollHeight;}
function button(label,fn,primary=false){const b=document.createElement('button');b.type='button';b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function dateLabel(date){const d=new Date(date+'T00:00:00Z'),week='日月火水木金土'[d.getUTCDay()];return date+'（'+week+'）';}
function renderResponse(data){const messages=Array.isArray(data.messages)?data.messages:data.status==='identity_required'?['LINEログインを確認できません。再読み込みしてください。']:['通常予約をご利用ください。'];for(const m of messages)bubble(m,'msg');
 if(data.choices?.length){const box=document.createElement('section');box.className='choices';box.setAttribute('aria-label','空き時間候補');for(const c of data.choices){const label=dateLabel(c.date)+' '+c.time+'〜　'+c.menuName;box.append(button(label,()=>sendText(c.text||c.time)));}log.append(box);}
 if(data.previousMenuAction){const box=document.createElement('section');box.className='actions';box.append(button(data.previousMenuAction.label,()=>sendText(data.previousMenuAction.text)));log.append(box);}
 if(data.confirmation){const q=data.confirmation,card=document.createElement('section');card.className='card';card.setAttribute('aria-label','予約内容の確認');const p=document.createElement('p');p.textContent=dateLabel(q.date)+' '+q.time+'　'+q.menuName+'　所要時間 '+q.durationMinutes+'分'+(q.price?'　料金 '+q.price:'');card.append(p);const actions=document.createElement('div');actions.className='actions';for(const a of data.actions||[]){actions.append(button(a.label,()=>sendText(a.text),a.kind==='confirm'));}card.append(actions);log.append(card);}
 if(data.completed){const q=data.completed,card=document.createElement('section');card.className='card';card.setAttribute('aria-label','予約完了');const p=document.createElement('p');p.textContent='予約が確定しました。'+dateLabel(q.date)+' '+q.time+'　'+q.menuName+'　所要時間 '+q.durationMinutes+'分'+(q.price?'　料金 '+q.price:'');card.append(p);const hint=document.createElement('p');hint.className='hint';hint.textContent='内容変更は一度キャンセルして再予約してください。当日変更・キャンセルは店舗へLINEまたはお電話でご連絡ください。';card.append(hint);log.append(card);}
 if(data.actions&&!data.confirmation){const box=document.createElement('section');box.className='actions';for(const a of data.actions){if(a.href){const link=document.createElement('a');link.href=a.href;link.textContent=a.label;box.append(link);}else box.append(button(a.label,()=>a.kind==='retry'?sendText(lastText):sendText(a.text||lastText)));}log.append(box);}
 if(data.status==='identity_required'){const box=document.createElement('div');box.className='actions';box.append(button('再読み込み',()=>location.reload()));log.append(box);input.disabled=true;send.disabled=true;authBlocked=true;}
 if(data.fallback==='regular_booking'){statusEl.textContent='AI案内を続けられない場合は通常予約をご利用ください。';if(!data.actions){const box=document.createElement('div');box.className='actions';box.append(button('再試行',()=>sendText(lastText)),button('通常予約へ',()=>location.href='../'));log.append(box);}}
 log.scrollTop=log.scrollHeight;
}
let busy=false,confirming=false;
async function sendText(value){if(locked||busy||!token)return;input.value=value;document.getElementById('form').requestSubmit();}
function turnId(){const b=new Uint8Array(24);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');}
async function aiOff(){try{const r=await fetch(API,{method:'POST',body:JSON.stringify({sourceType:'AI_BOOKING',action:'status'}),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});const d=await r.json();return d&&d.status==='disabled';}catch(_){return false;}}
async function boot(){if(await aiOff()){statusEl.textContent='AI受付は現在準備中のため、ご利用いただけません。';bubble('AI受付は現在準備中です。お手数ですが「メニューから予約」をご利用ください。','msg');const box=document.createElement('div'),link=document.createElement('a');box.className='actions';link.href='../';link.textContent='メニューから予約へ';box.append(link);log.append(box);document.querySelector('.form').classList.add('disabled');locked=true;return;}let phase='SDK';try{if(typeof liff==='undefined')throw 0;phase='LIFF_INIT';await liff.init({liffId:LIFF_ID});phase='LOGIN';if(!liff.isLoggedIn()){statusEl.textContent='LINEログインが必要です。LINE内で開き直してください。';liff.login();return;}phase='ID_TOKEN';token=liff.getIDToken();if(!token)throw 0;statusEl.textContent='LINEログイン済み。予約希望を送ると本人確認します。';input.disabled=false;send.disabled=false;bubble('ご希望の日付やメニューを送ってください。例：明日空いてる？　複雑な施術相談は店舗へお問い合わせください。','msg');}catch(_){statusEl.textContent='LINE認証を確認できません（'+phase+'）。通常予約をご利用ください。';document.querySelector('.form').classList.add('disabled');}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||!token||locked||busy)return;busy=true;confirming=text==='それでお願い';lastText=text;input.disabled=true;send.disabled=true;for(const b of log.querySelectorAll('button'))b.disabled=true;bubble(text,'user');try{const r=await fetch(API,{method:'POST',body:JSON.stringify({sourceType:'AI_BOOKING',action:'turn',lineIdToken:token,text,turnId:turnId()}),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});const data=await r.json();if(!r.ok)throw Error('network');if(data.status==='success'&&!data.fallback&&!data.errorType)input.value='';else input.value=text;renderResponse(data);if(data.cancelToken&&data.reservationId){const p=document.createElement('p'),a=document.createElement('a');a.href='../cancel/#cancel='+encodeURIComponent(data.reservationId)+'&token='+encodeURIComponent(data.cancelToken);a.textContent='予約のキャンセル用リンクを保存';p.appendChild(a);log.appendChild(p);}if(data.completed){locked=true;input.value='';}if(confirming&&data.status!=='success')locked=true;}catch(_){input.value=text;statusEl.textContent='通信を確認してください。';if(confirming){locked=true;bubble('通信が途切れたため、予約が確定したか確認できませんでした。LINE通知が有効な環境では、確定済みならLINEに通知が届きます。開発環境では通知を停止しています。通常予約から予約状況をご確認ください。確認できない場合は店舗へLINEまたはお電話でお問い合わせください。','msg');const box=document.createElement('div'),link=document.createElement('a');box.className='actions';link.href='../';link.textContent='通常予約から予約状況を確認';box.append(link);log.append(box);log.scrollTop=log.scrollHeight;}else{bubble('通信に失敗しました。入力内容を保持しています。再試行するか、通常予約をご利用ください。','msg');const box=document.createElement('div');box.className='actions';box.append(button('再試行',()=>sendText(lastText)),button('通常予約へ',()=>location.href='../'));log.append(box);log.scrollTop=log.scrollHeight;}}finally{busy=false;confirming=false;if(!locked&&!authBlocked){input.disabled=false;send.disabled=false;for(const b of log.querySelectorAll('button'))b.disabled=false;input.focus();}}});
document.getElementById('clear').addEventListener('click',async()=>{document.getElementById('text').value='やめる';document.getElementById('form').requestSubmit();});boot();</script></body></html>
